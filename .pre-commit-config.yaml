# The same checks CI runs, run before a commit exists rather than after.
#
# The secret scan is the one that earns its place here rather than only in CI:
# Definition of Done item 8 covers Git history, and history is the one thing a
# later fix cannot clean. Catching a key before the commit is the difference
# between deleting a line and rewriting a repository.
#
#   pre-commit install

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: types (strict)
        entry: mypy src tests
        language: system
        pass_filenames: false
        types: [python]

      - id: import-linter
        name: layering
        entry: lint-imports
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest
        name: tests
        entry: pytest -q
        language: system
        pass_filenames: false
        types: [python]
