openapi: 3.1.0
info:
  title: Salesforce connector
  version: v67.0
  description: 'One reusable core with five typed actions. Every action takes a JSON body
    and answers with the same envelope, so a caller handles one shape rather than five. Generated
    from the same schemas the MCP tools publish, so the two cannot disagree.


    Authentication is the OAuth 2.0 JWT Bearer flow, held by the connector and read from its
    environment. No caller credential is accepted or forwarded.'
tags:
- name: read
  description: Changes nothing.
- name: write
  description: Changes Salesforce. Needs an idempotency key.
paths:
  /actions/salesforce.add_activity_note:
    post:
      operationId: salesforce_add_activity_note
      summary: Log an activity note in Salesforce
      description: "Record a call, email, meeting, or note against a Salesforce contact or\
        \ opportunity, so it appears on that record's activity timeline.\n\nUse this when:\
        \ the user wants to capture what happened with someone, such as a call summary, a\
        \ meeting outcome, or a note to the account team, and you have the record it belongs\
        \ to.\nDo not use this when: the information belongs on the record itself, such as\
        \ a corrected phone number, which is the update action; or you do not know which record\
        \ it attaches to, in which case search first rather than guessing.\n\nExample -- Log\
        \ a call against a contact\n  call: {\"activity_kind\": \"Call\", \"approved\": true,\
        \ \"body\": \"Walked through pricing. Wants a quote by Friday.\", \"idempotency_key\"\
        : \"d4e5f6a7-b8c9-4d0e-9f1a-3b4c5d6e7f8a\", \"related_to_id\": \"003xx000004TmiQAAS\"\
        , \"subject\": \"Intro call\"}\n  returns: {\"created\": true, \"id\": \"00Txx0000012345AAA\"\
        , \"related_to_id\": \"003xx000004TmiQAAS\", \"subject\": \"Intro call\"}\n\nFailures\
        \ and what to do:\n- salesforce.record_not_found: No record has that id, or it has\
        \ been deleted. Do not retry with the same id. Search for the contact or opportunity\
        \ by name, and confirm with the user which record they meant.\n- connector.invalid_input:\
        \ A required field was missing, or the subject exceeded 255 characters. Shorten the\
        \ subject and move the detail into body, or ask the user for the missing value, then\
        \ call again with the same idempotency key.\n- salesforce.permission_denied: This\
        \ Salesforce user may not create activities on that record. Do not retry. Report that\
        \ the profile lacks the permission and an administrator must grant it.\n- salesforce.rate_limited:\
        \ The org has spent its API allowance for now. Wait the stated number of seconds,\
        \ then repeat with the same key.\n- salesforce.transport_failed: The request did not\
        \ complete, so the note may or may not have been saved. Repeat with the identical\
        \ idempotency key. Retrying with a new key would put the same note on the timeline\
        \ twice."
      tags:
      - write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $defs:
                ActivityKind:
                  description: How the interaction happened.
                  enum:
                  - Call
                  - Email
                  - Meeting
                  - Other
                  title: ActivityKind
                  type: string
              additionalProperties: false
              description: The interaction to record.
              properties:
                related_to_id:
                  description: 'Required. Record the note belongs to: a contact id starting
                    003, or an opportunity id starting 006. Search for it first if you do
                    not have it. A note on the wrong record is worse than no note.'
                  maxLength: 18
                  minLength: 15
                  title: Related To Id
                  type: string
                subject:
                  description: Required. One line summarising what happened, for example 'Renewal
                    call - agreed to 12 month extension'. This is what a person sees in the
                    activity timeline, so make it readable on its own.
                  maxLength: 255
                  minLength: 1
                  title: Subject
                  type: string
                idempotency_key:
                  description: 'A unique id you generate for this logical write, for example
                    a UUID. Required. If you retry this call after a timeout or an unclear
                    failure, send the identical value: the connector recognises it and returns
                    the original outcome instead of writing a second record. Generate a new
                    value only when you genuinely intend a separate record.'
                  minLength: 8
                  title: Idempotency Key
                  type: string
                approved:
                  default: false
                  description: 'Optional, defaults to false. Set to true only after a person
                    has seen and confirmed this write. A write arriving without it is refused,
                    and the refusal says so. It is declared here because a tool must not ask
                    for an argument its own schema does not offer: a caller working from the
                    schema alone would have no way to supply it.'
                  title: Approved
                  type: boolean
                body:
                  anyOf:
                  - maxLength: 32000
                    type: string
                  - type: 'null'
                  default: null
                  description: Optional. The detail behind the subject. Write what was said
                    or agreed, not a restatement of the subject line.
                  title: Body
                activity_kind:
                  anyOf:
                  - $ref: '#/$defs/ActivityKind'
                  - type: 'null'
                  default: null
                  description: 'Optional. How the interaction happened. Omit it for a plain
                    note and Salesforce applies this org''s own default: the underlying field
                    is a restricted picklist configured per org, so a value invented here
                    can be rejected outright. Send one only when the user actually said how
                    the interaction happened.'
                activity_date:
                  anyOf:
                  - format: date
                    type: string
                  - type: 'null'
                  default: null
                  description: Optional. When it happened, written as YYYY-MM-DD. Defaults
                    to today. Use the date the user described, not today's, when logging something
                    past.
                  examples:
                  - '2026-08-09'
                  title: Activity Date
              required:
              - related_to_id
              - subject
              - idempotency_key
              title: AddActivityNoteInput
              type: object
            examples:
              Log a call against a contact:
                summary: Log a call against a contact
                value:
                  related_to_id: 003xx000004TmiQAAS
                  subject: Intro call
                  body: Walked through pricing. Wants a quote by Friday.
                  activity_kind: Call
                  idempotency_key: d4e5f6a7-b8c9-4d0e-9f1a-3b4c5d6e7f8a
                  approved: true
              Log the same note against an opportunity instead:
                summary: Log the same note against an opportunity instead
                value:
                  related_to_id: 006xx000004TmiQAAS
                  subject: Quote sent
                  idempotency_key: e5f6a7b8-c9d0-4e1f-8a2b-4c5d6e7f8a9b
                  approved: true
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    additionalProperties: false
                    description: The activity now on the record's timeline.
                    properties:
                      id:
                        description: Record id of the created activity, starting 00T.
                        title: Id
                        type: string
                      subject:
                        description: Subject as stored.
                        title: Subject
                        type: string
                      related_to_id:
                        description: Record the activity is attached to.
                        title: Related To Id
                        type: string
                      created:
                        description: True if this call created it. False means the identical
                          key had already created it and this is the original outcome.
                        title: Created
                        type: boolean
                    required:
                    - id
                    - subject
                    - related_to_id
                    - created
                    title: AddActivityNoteOutput
                    type: object
                  error:
                    oneOf:
                    - &id001
                      type: object
                      description: A failure described so its reader knows what to do next.
                      properties:
                        code:
                          type: string
                          description: Stable identifier for this failure.
                        category:
                          type: string
                          enum:
                          - transient
                          - input
                          - resource
                          - fatal
                          description: 'What the caller should do: wait and retry, fix an
                            argument, stop and report, or escalate.'
                        reason:
                          type: string
                          description: What went wrong.
                        next_step:
                          type: string
                          description: What to do about it.
                        retryable:
                          type: boolean
                        retry_after_seconds:
                          type:
                          - number
                          - 'null'
                        invalid_fields:
                          type: array
                          items:
                            type: string
                      required:
                      - code
                      - category
                      - reason
                      - next_step
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Log a call against a contact:
                  summary: Log a call against a contact
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      id: 00Txx0000012345AAA
                      subject: Intro call
                      related_to_id: 003xx000004TmiQAAS
                      created: true
                Log the same note against an opportunity instead:
                  summary: Log the same note against an opportunity instead
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      id: 00Txx0000012346AAA
                      subject: Quote sent
                      related_to_id: 006xx000004TmiQAAS
                      created: true
  /actions/salesforce.count_records:
    post:
      operationId: salesforce_count_records
      summary: Count Salesforce records by object
      description: "Report how many records exist for one or more Salesforce objects, without\
        \ reading the records themselves.\n\nUse this when: the user asked how much of something\
        \ there is in total, across a whole object: how many contacts, how many opportunities,\
        \ how big is the database. Several objects can be counted in one call.\nDo not use\
        \ this when: the question has any condition attached, such as how many were created\
        \ this month or how many belong to one account. This counts everything and cannot\
        \ filter; salesforce_soql_query with SELECT COUNT() and a WHERE clause is the tool\
        \ for that. Also not for reading the records themselves.\n\nExample -- Count one object\n\
        \  call: {\"objects\": [\"Contact\"]}\n  returns: {\"counts\": [{\"count\": 7, \"\
        name\": \"Contact\"}], \"not_counted\": null}\n\nFailures and what to do:\n- connector.invalid_input:\
        \ No object was named, or too many were asked for at once. Name at least one object,\
        \ and no more than twenty per call.\n- salesforce.permission_denied: This user may\
        \ not read one of the objects named. Do not retry. The result lists the objects that\
        \ were readable; report which was refused and that an administrator must grant read\
        \ access.\n- salesforce.rate_limited: The org has spent its API allowance for now.\
        \ Wait the stated number of seconds, then repeat the same call.\n- salesforce.transport_failed:\
        \ Salesforce did not answer in time. Wait briefly and repeat. Counting changes nothing,\
        \ so retrying is always safe."
      tags:
      - read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Which objects to count.
              properties:
                objects:
                  description: 'Required. Salesforce object names to count, spelled as Salesforce
                    spells them: Contact, Opportunity, Lead, Account, Task, or a custom object
                    ending __c. Ask for several at once rather than calling repeatedly; one
                    call answers for all of them.


                    This counts every record of that type. It cannot count a subset. For ''how
                    many contacts at Acme'' or ''how many deals closed this month'', use salesforce_soql_query
                    with SELECT COUNT() and a WHERE clause instead.'
                  examples:
                  - - Contact
                  - - Contact
                    - Opportunity
                    - Lead
                  items:
                    type: string
                  maxItems: 20
                  minItems: 1
                  title: Objects
                  type: array
              required:
              - objects
              title: CountRecordsInput
              type: object
            examples:
              Count one object:
                summary: Count one object
                value:
                  objects:
                  - Contact
              Count several at once:
                summary: Count several at once
                value:
                  objects:
                  - Contact
                  - Opportunity
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    $defs:
                      ObjectCount:
                        additionalProperties: false
                        description: One object and how many records it holds.
                        properties:
                          name:
                            description: The object, as Salesforce names it.
                            title: Name
                            type: string
                          count:
                            description: How many records of this type exist.
                            title: Count
                            type: integer
                        required:
                        - name
                        - count
                        title: ObjectCount
                        type: object
                    additionalProperties: false
                    description: A count for each object that was asked about.
                    properties:
                      counts:
                        description: One entry per object Salesforce could count. These counts
                          are cached and approximate, not live. An object asked for but absent
                          here was not counted, which is not the same as having no records.
                        items:
                          $ref: '#/$defs/ObjectCount'
                        title: Counts
                        type: array
                      not_counted:
                        anyOf:
                        - type: string
                        - type: 'null'
                        default: null
                        description: Present when Salesforce declined to count something that
                          was asked for, naming which objects and the tool that can answer
                          exactly. Absent when everything asked for came back.
                        title: Not Counted
                    required:
                    - counts
                    title: CountRecordsOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Count one object:
                  summary: Count one object
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      counts:
                      - name: Contact
                        count: 7
                      not_counted: null
                Count several at once:
                  summary: Count several at once
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      counts:
                      - name: Contact
                        count: 7
                      - name: Opportunity
                        count: 2
                      not_counted: null
  /actions/salesforce.create_contact:
    post:
      operationId: salesforce_create_contact
      summary: Create a Salesforce contact
      description: "Create a new person record in Salesforce and return its record id.\n\n\
        Use this when: the user has asked for a new contact to be added and you have at least\
        \ a family name, and a search has shown the person is not already there.\nDo not use\
        \ this when: you have not searched first, since a duplicate person is the most common\
        \ damage this connector can do; or the person already exists and you mean to change\
        \ them, which is the update action; or you want to record an interaction, which is\
        \ the activity note action.\n\nExample -- Create a contact after searching and finding\
        \ nobody\n  call: {\"approved\": true, \"email\": \"ada@example.com\", \"first_name\"\
        : \"Ada\", \"idempotency_key\": \"8f14e45f-ea11-4b52-9f1a-0c2d3e4f5a6b\", \"last_name\"\
        : \"Lovelace\"}\n  returns: {\"created\": true, \"id\": \"003xx000004TmiQAAS\", \"\
        name\": \"Ada Lovelace\"}\n\nFailures and what to do:\n- salesforce.conflict: Salesforce\
        \ duplicate rules matched an existing contact. Do not repeat this call unchanged.\
        \ The matched record ids are in the error. Use the existing contact, or ask the user\
        \ whether they really want a second record and only then call again with allow_duplicate=true.\n\
        - connector.invalid_input: A field was missing or malformed; the error names which.\
        \ Correct the named field and call again with the same idempotency key. If the value\
        \ is genuinely unknown, ask the user for it.\n- salesforce.record_not_found: The account_id\
        \ you supplied does not exist. Omit account_id, or find the correct account first.\
        \ Do not guess an id.\n- salesforce.permission_denied: This Salesforce user may not\
        \ create contacts. Do not retry. Tell the user their profile lacks Create on Contact\
        \ and an administrator must grant it.\n- salesforce.rate_limited: The org has spent\
        \ its API allowance for now. Wait the stated number of seconds, then repeat the call\
        \ with the same key.\n- salesforce.transport_failed: The request did not complete,\
        \ so the contact may or may not exist. Repeat the call with the identical idempotency\
        \ key. If the record was already created, you will get that original result rather\
        \ than a second contact. Never retry with a new key."
      tags:
      - write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: The contact to create.
              properties:
                last_name:
                  description: Required. Family name. This is the only field Salesforce insists
                    on. If you do not know it, ask the user rather than inventing one or putting
                    the full name here.
                  maxLength: 80
                  minLength: 1
                  title: Last Name
                  type: string
                idempotency_key:
                  description: 'A unique id you generate for this logical write, for example
                    a UUID. Required. If you retry this call after a timeout or an unclear
                    failure, send the identical value: the connector recognises it and returns
                    the original outcome instead of writing a second record. Generate a new
                    value only when you genuinely intend a separate record.'
                  minLength: 8
                  title: Idempotency Key
                  type: string
                approved:
                  default: false
                  description: 'Optional, defaults to false. Set to true only after a person
                    has seen and confirmed this write. A write arriving without it is refused,
                    and the refusal says so. It is declared here because a tool must not ask
                    for an argument its own schema does not offer: a caller working from the
                    schema alone would have no way to supply it.'
                  title: Approved
                  type: boolean
                first_name:
                  anyOf:
                  - maxLength: 40
                    type: string
                  - type: 'null'
                  default: null
                  description: Optional. Given name.
                  title: First Name
                email:
                  anyOf:
                  - format: email
                    type: string
                  - type: 'null'
                  default: null
                  description: Optional. An email address, rejected before sending if malformed.
                  examples:
                  - ada@example.com
                  title: Email
                phone:
                  anyOf:
                  - maxLength: 40
                    type: string
                  - type: 'null'
                  default: null
                  description: Optional. Any format Salesforce accepts.
                  title: Phone
                title:
                  anyOf:
                  - maxLength: 128
                    type: string
                  - type: 'null'
                  default: null
                  description: Optional. Job title.
                  title: Title
                account_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  description: Optional. Id of the account this person belongs to, starting
                    001. Omit it if you do not have one; do not guess.
                  title: Account Id
                allow_duplicate:
                  default: false
                  description: Optional, defaults to false. When false, a contact matching
                    the org's duplicate rules is refused and the matches are returned so you
                    can use an existing record instead. Set true only after the user has confirmed
                    they want a second record.
                  title: Allow Duplicate
                  type: boolean
              required:
              - last_name
              - idempotency_key
              title: CreateContactInput
              type: object
            examples:
              Create a contact after searching and finding nobody:
                summary: Create a contact after searching and finding nobody
                value:
                  last_name: Lovelace
                  first_name: Ada
                  email: ada@example.com
                  idempotency_key: 8f14e45f-ea11-4b52-9f1a-0c2d3e4f5a6b
                  approved: true
              'The same key sent again after a timeout: no second record':
                summary: 'The same key sent again after a timeout: no second record'
                value:
                  last_name: Lovelace
                  first_name: Ada
                  email: ada@example.com
                  idempotency_key: 8f14e45f-ea11-4b52-9f1a-0c2d3e4f5a6b
                  approved: true
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    additionalProperties: false
                    description: The contact that now exists.
                    properties:
                      id:
                        description: Record id of the created contact.
                        title: Id
                        type: string
                      name:
                        description: Full name as Salesforce assembled it.
                        title: Name
                        type: string
                      created:
                        description: True if this call created the record. False means the
                          identical idempotency key had already created it and this is the
                          original outcome, not a second record.
                        title: Created
                        type: boolean
                    required:
                    - id
                    - name
                    - created
                    title: CreateContactOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Create a contact after searching and finding nobody:
                  summary: Create a contact after searching and finding nobody
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      id: 003xx000004TmiQAAS
                      name: Ada Lovelace
                      created: true
                'The same key sent again after a timeout: no second record':
                  summary: 'The same key sent again after a timeout: no second record'
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      id: 003xx000004TmiQAAS
                      name: Ada Lovelace
                      created: false
  /actions/salesforce.create_opportunity:
    post:
      operationId: salesforce_create_opportunity
      summary: Create a Salesforce opportunity
      description: "Create a sales opportunity in Salesforce, optionally linked to an account\
        \ and a contact, and return its record id.\n\nUse this when: the user wants to record\
        \ a new deal, renewal, or piece of pipeline, and you have a name, a stage, and an\
        \ expected close date.\nDo not use this when: you already have the contact id and\
        \ the deal is for that person, in which case salesforce_create_opportunity_with_contact\
        \ does both in one write that cannot half-fail; the deal already exists and needs\
        \ changing; you only want to log a conversation, which is the activity note; or you\
        \ are missing the stage or close date, in which case ask the user rather than inventing\
        \ them.\n\nExample -- Open a deal\n  call: {\"account_id\": \"001xx000003DGb2AAG\"\
        , \"amount\": 45000, \"approved\": true, \"close_date\": \"2026-12-01\", \"idempotency_key\"\
        : \"c3d4e5f6-a7b8-4c9d-8e0f-2a3b4c5d6e7f\", \"name\": \"Example Corp - annual renewal\"\
        , \"stage_name\": \"Qualify\"}\n  returns: {\"created\": true, \"id\": \"006xx000004TmiQAAS\"\
        , \"name\": \"Example Corp - annual renewal\", \"next_action\": \"This deal has no\
        \ contact attached. If it is for a specific person, call salesforce_link_contact_to_opportunity\
        \ with opportunity_id=006xx000004TmiQAAS and their contact id.\", \"stage_name\":\
        \ \"Qualify\"}\n\nFailures and what to do:\n- connector.invalid_input: A required\
        \ field was missing, or stage_name is not a stage this org uses. The error lists the\
        \ exact stages this org accepts. Choose one of them, or ask the user which they meant,\
        \ then call again with the same idempotency key. Do not invent a stage name.\n- salesforce.record_not_found:\
        \ The account_id does not exist. Search for the right record, or omit the optional\
        \ id. Never guess an id: a valid-looking one may belong to something else.\n- salesforce.permission_denied:\
        \ This Salesforce user may not create opportunities. Do not retry. Report that the\
        \ profile lacks Create on Opportunity and an administrator must grant it.\n- salesforce.conflict:\
        \ Duplicate rules matched an existing opportunity. Do not repeat unchanged. Show the\
        \ user the matching deal and ask whether they meant that one.\n- salesforce.rate_limited:\
        \ The org has spent its API allowance for now. Wait the stated number of seconds,\
        \ then repeat with the same key.\n- salesforce.transport_failed: The request did not\
        \ complete, so the opportunity may or may not exist. Repeat with the identical idempotency\
        \ key, which returns the original result if it was already created. Read next_action\
        \ in the result: it false, the deal exists and only the link is missing: do not create\
        \ it again."
      tags:
      - write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: The deal to create.
              properties:
                name:
                  description: Required. What the deal is called, for example 'Acme Corp -
                    annual renewal'. Salesforce does not require this to be unique, so make
                    it recognisable to a person.
                  maxLength: 120
                  minLength: 1
                  title: Name
                  type: string
                stage_name:
                  description: 'Required. The sales stage, for example ''Prospecting'' or
                    ''Closed Won''. Every Salesforce org configures its own stages, so there
                    is no universal list. If you are not certain which stages this org uses,
                    send your best guess: an invalid value is rejected and the error lists
                    the exact values this org accepts.'
                  title: Stage Name
                  type: string
                close_date:
                  description: Required. Expected close date, written as YYYY-MM-DD. Salesforce
                    accepts a date in the past, so use the date the user actually meant rather
                    than today's.
                  examples:
                  - '2026-12-01'
                  format: date
                  title: Close Date
                  type: string
                idempotency_key:
                  description: 'A unique id you generate for this logical write, for example
                    a UUID. Required. If you retry this call after a timeout or an unclear
                    failure, send the identical value: the connector recognises it and returns
                    the original outcome instead of writing a second record. Generate a new
                    value only when you genuinely intend a separate record.'
                  minLength: 8
                  title: Idempotency Key
                  type: string
                approved:
                  default: false
                  description: 'Optional, defaults to false. Set to true only after a person
                    has seen and confirmed this write. A write arriving without it is refused,
                    and the refusal says so. It is declared here because a tool must not ask
                    for an argument its own schema does not offer: a caller working from the
                    schema alone would have no way to supply it.'
                  title: Approved
                  type: boolean
                account_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  description: Optional. Account the deal belongs to, id starting 001. Do
                    not guess.
                  title: Account Id
                amount:
                  anyOf:
                  - minimum: 0
                    type: number
                  - type: 'null'
                  default: null
                  description: Optional. Value of the deal in the org's currency, written
                    in digits rather than words.
                  examples:
                  - 45000
                  title: Amount
                description:
                  anyOf:
                  - maxLength: 32000
                    type: string
                  - type: 'null'
                  default: null
                  description: Optional. Free-text notes.
                  title: Description
              required:
              - name
              - stage_name
              - close_date
              - idempotency_key
              title: CreateOpportunityInput
              type: object
            examples:
              Open a deal:
                summary: Open a deal
                value:
                  name: Example Corp - annual renewal
                  stage_name: Qualify
                  close_date: '2026-12-01'
                  amount: 45000
                  account_id: 001xx000003DGb2AAG
                  idempotency_key: c3d4e5f6-a7b8-4c9d-8e0f-2a3b4c5d6e7f
                  approved: true
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    additionalProperties: false
                    description: The deal that now exists, and whether the contact link took.
                    properties:
                      id:
                        description: Record id of the created opportunity.
                        title: Id
                        type: string
                      name:
                        description: Name as stored.
                        title: Name
                        type: string
                      stage_name:
                        description: Stage as stored.
                        title: Stage Name
                        type: string
                      created:
                        description: True if this call created the record. False means the
                          identical key had already created it and this is the original outcome.
                        title: Created
                        type: boolean
                      next_action:
                        anyOf:
                        - type: string
                        - type: 'null'
                        default: null
                        description: What is still unfinished, and which tool finishes it.
                          Present only when the deal has no contact attached; absent means
                          there is nothing further to do.
                        title: Next Action
                    required:
                    - id
                    - name
                    - stage_name
                    - created
                    title: CreateOpportunityOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Open a deal:
                  summary: Open a deal
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      id: 006xx000004TmiQAAS
                      name: Example Corp - annual renewal
                      stage_name: Qualify
                      created: true
                      next_action: This deal has no contact attached. If it is for a specific
                        person, call salesforce_link_contact_to_opportunity with opportunity_id=006xx000004TmiQAAS
                        and their contact id.
  /actions/salesforce.create_opportunity_with_contact:
    post:
      operationId: salesforce_create_opportunity_with_contact
      summary: Create a Salesforce opportunity and attach its contact together
      description: "Open a deal and attach the person it is for in a single write that either\
        \ fully succeeds or changes nothing at all.\n\nUse this when: the user asked to open\
        \ a deal for a specific person and you already have that person's contact id. One\
        \ call, and no moment where the deal exists without them.\nDo not use this when: you\
        \ do not have the contact id yet, in which case use salesforce_create_opportunity\
        \ now and attach the contact afterwards with salesforce_link_contact_to_opportunity;\
        \ the deal is not for a particular person, which is salesforce_create_opportunity\
        \ on its own; or the deal already exists and only needs a contact attached, which\
        \ is salesforce_link_contact_to_opportunity.\n\nExample -- Open a deal for a known\
        \ contact\n  call: {\"amount\": 45000, \"approved\": true, \"close_date\": \"2026-12-01\"\
        , \"contact_id\": \"003xx000004TmiQAAS\", \"idempotency_key\": \"a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d\"\
        , \"name\": \"Example Corp - annual renewal\", \"stage_name\": \"Qualify\"}\n  returns:\
        \ {\"contact_id\": \"003xx000004TmiQAAS\", \"contact_role_id\": \"00Kxx0000011AAAI\"\
        , \"created\": true, \"id\": \"006xx000004TmiQAAS\", \"name\": \"Example Corp - annual\
        \ renewal\", \"stage_name\": \"Qualify\"}\n\nFailures and what to do:\n- connector.invalid_input:\
        \ The stage or role is not a value this org accepts, or a required field is missing.\
        \ The message names which of the two writes was rejected. Nothing was created, so\
        \ fix the named value and call again with the same idempotency key. For a rejected\
        \ stage or role, call salesforce_describe_object on Opportunity and use a value it\
        \ lists.\n- salesforce.record_not_found: The contact id or account id does not refer\
        \ to a record that exists. Nothing was created. Search for the contact again rather\
        \ than retrying the same id, then call again.\n- salesforce.permission_denied: This\
        \ user may not create opportunities or contact roles. Do not retry. Report which of\
        \ the two was refused and that an administrator must grant create access.\n- salesforce.rate_limited:\
        \ The org has spent its API allowance for now. Wait the stated number of seconds,\
        \ then repeat with the same idempotency key.\n- salesforce.transport_failed: Salesforce\
        \ did not answer in time. Repeat with the identical idempotency key. Either both records\
        \ exist or neither does, so there is no partial state to inspect first.\n- connector.escalate_to_human:\
        \ The write failed three times in a row and will not succeed by retrying. Stop calling\
        \ this tool. Tell the user it must be done by hand and how."
      tags:
      - write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: The deal, and the person it is for.
              properties:
                name:
                  description: Required. What the deal is called. Use something a person would
                    recognise in a list, usually the account and what it is for.
                  examples:
                  - Example Corp - annual renewal
                  maxLength: 120
                  minLength: 1
                  title: Name
                  type: string
                stage_name:
                  description: 'Required. The sales stage. Stages are configured per org,
                    so do not assume the Salesforce defaults: call salesforce_describe_object
                    on Opportunity and use a value it reports. A stage this org does not have
                    fails the whole write, including the contact link.'
                  maxLength: 80
                  minLength: 1
                  title: Stage Name
                  type: string
                close_date:
                  description: Required. Expected close date, written as YYYY-MM-DD. Ask the
                    user rather than inventing one; a date invented here becomes a forecast
                    somebody relies on.
                  examples:
                  - '2026-12-01'
                  format: date
                  title: Close Date
                  type: string
                contact_id:
                  description: Required. The person the deal is for. Find them with salesforce_search_contact
                    first. A contact id starts 003; if you do not have one, use salesforce_create_opportunity
                    instead and attach the contact afterwards.
                  maxLength: 18
                  minLength: 15
                  title: Contact Id
                  type: string
                amount:
                  anyOf:
                  - minimum: 0
                    type: number
                  - type: 'null'
                  default: null
                  description: Optional. Value of the deal, in the org's currency, written
                    in digits rather than words.
                  examples:
                  - 45000
                  title: Amount
                account_id:
                  anyOf:
                  - maxLength: 18
                    minLength: 15
                    type: string
                  - type: 'null'
                  default: null
                  description: Optional. The company the deal belongs to. An account id starts
                    001.
                  title: Account Id
                role:
                  anyOf:
                  - maxLength: 80
                    type: string
                  - type: 'null'
                  default: null
                  description: 'Optional. The contact''s part in the deal, such as Decision
                    Maker. Leave it out unless the user said one: roles are a restricted picklist
                    in most orgs, and a value this org does not have fails the whole write.'
                  title: Role
                idempotency_key:
                  description: Required. A unique string for this deal. Reuse it when retrying
                    so the same deal is not opened twice.
                  maxLength: 128
                  minLength: 8
                  title: Idempotency Key
                  type: string
                approved:
                  default: false
                  description: Optional, defaults to false, but the call is refused without
                    it. Confirmation that the user asked for this deal to be created.
                  title: Approved
                  type: boolean
              required:
              - name
              - stage_name
              - close_date
              - contact_id
              - idempotency_key
              title: CreateOpportunityWithContactInput
              type: object
            examples:
              Open a deal for a known contact:
                summary: Open a deal for a known contact
                value:
                  name: Example Corp - annual renewal
                  stage_name: Qualify
                  close_date: '2026-12-01'
                  contact_id: 003xx000004TmiQAAS
                  amount: 45000
                  idempotency_key: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                  approved: true
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    additionalProperties: false
                    description: The deal and the link, both of which now exist or neither
                      of which does.
                    properties:
                      id:
                        description: Record id of the created opportunity.
                        title: Id
                        type: string
                      name:
                        description: Name as stored.
                        title: Name
                        type: string
                      stage_name:
                        description: Stage as stored.
                        title: Stage Name
                        type: string
                      contact_id:
                        description: The contact that was attached.
                        title: Contact Id
                        type: string
                      contact_role_id:
                        description: Record id of the contact role joining the two.
                        title: Contact Role Id
                        type: string
                      created:
                        description: True if this call created the deal. False means the identical
                          key had already created it and this is the original outcome.
                        title: Created
                        type: boolean
                    required:
                    - id
                    - name
                    - stage_name
                    - contact_id
                    - contact_role_id
                    - created
                    title: CreateOpportunityWithContactOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Open a deal for a known contact:
                  summary: Open a deal for a known contact
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      id: 006xx000004TmiQAAS
                      name: Example Corp - annual renewal
                      stage_name: Qualify
                      contact_id: 003xx000004TmiQAAS
                      contact_role_id: 00Kxx0000011AAAI
                      created: true
  /actions/salesforce.describe_object:
    post:
      operationId: salesforce_describe_object
      summary: Describe a Salesforce object's fields
      description: "List an object's field names, types, and the picklist values this org\
        \ accepts, so a call can be written correctly the first time.\n\nUse this when: before\
        \ writing to an object you have not written to before; when a call failed because\
        \ a field name or picklist value was not recognised; or when the user asks what can\
        \ be stored about something. Picklists are configured per org, so this is the only\
        \ reliable way to learn a stage or a status.\nDo not use this when: you already know\
        \ the field names, since this returns a lot and costs context; or you want the records\
        \ themselves rather than the shape of them, which is salesforce_get_record or salesforce_soql_query.\n\
        \nExample -- Learn which sales stages this org accepts\n  call: {\"object_name\":\
        \ \"Opportunity\", \"only_writable\": true}\n  returns: {\"fields\": [{\"label\":\
        \ \"Stage\", \"name\": \"StageName\", \"picklist_values\": [\"Qualify\", \"Propose\"\
        , \"Closed Won\"], \"relationship_name\": null, \"required\": true, \"type\": \"picklist\"\
        , \"updateable\": true}], \"label\": \"Opportunity\", \"object_name\": \"Opportunity\"\
        , \"returned\": 1}\n\nFailures and what to do:\n- salesforce.record_not_found: No\
        \ object has that name in this org. Check the spelling: Salesforce object names are\
        \ capitalised and custom ones end __c. Do not retry the same name.\n- salesforce.permission_denied:\
        \ This user may not see that object's definition. Do not retry. Report that an administrator\
        \ must grant access to the object.\n- salesforce.rate_limited: The org has spent its\
        \ API allowance for now. Wait the stated number of seconds, then repeat the same call.\n\
        - salesforce.transport_failed: Salesforce did not answer in time. Wait briefly and\
        \ repeat. A describe is a large response, so a timeout here is more likely than on\
        \ other reads."
      tags:
      - read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Which object to describe.
              properties:
                object_name:
                  description: 'Required. The object, spelled as Salesforce spells it: Contact,
                    Opportunity, Account, Lead, Task, or a custom object ending __c.'
                  examples:
                  - Contact
                  - Opportunity
                  maxLength: 80
                  minLength: 1
                  title: Object Name
                  type: string
                only_writable:
                  default: false
                  description: Optional, defaults to false. When true, returns only the fields
                    that can be set, which is what you want before creating or updating a
                    record. Formula fields, rollups and system fields such as CreatedDate
                    are dropped, because writing to one fails.
                  title: Only Writable
                  type: boolean
              required:
              - object_name
              title: DescribeObjectInput
              type: object
            examples:
              Learn which sales stages this org accepts:
                summary: Learn which sales stages this org accepts
                value:
                  object_name: Opportunity
                  only_writable: true
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    $defs:
                      FieldDescription:
                        additionalProperties: false
                        description: One field, reduced to what a caller needs to use it.
                        properties:
                          name:
                            description: The API name, which is what a call must use.
                            title: Name
                            type: string
                          label:
                            description: What a person sees in the Salesforce UI.
                            title: Label
                            type: string
                          type:
                            description: string, picklist, date, currency, reference, and
                              so on.
                            title: Type
                            type: string
                          required:
                            description: True when a create fails without it and Salesforce
                              supplies no default.
                            title: Required
                            type: boolean
                          updateable:
                            description: False for a field that cannot be written to.
                            title: Updateable
                            type: boolean
                          picklist_values:
                            default: []
                            description: 'The active values this org accepts, for a picklist
                              field. Empty for every other type. These are configured per
                              org: never assume a value that is not listed here.'
                            items:
                              type: string
                            title: Picklist Values
                            type: array
                          relationship_name:
                            anyOf:
                            - type: string
                            - type: 'null'
                            default: null
                            description: For a lookup field, the name to follow with salesforce_get_related.
                              A Contact's AccountId is followed as the relationship named
                              Account.
                            title: Relationship Name
                        required:
                        - name
                        - label
                        - type
                        - required
                        - updateable
                        title: FieldDescription
                        type: object
                    additionalProperties: false
                    description: The object's fields, and how many there were.
                    properties:
                      object_name:
                        description: The object described.
                        title: Object Name
                        type: string
                      label:
                        description: What a person calls it in the UI.
                        title: Label
                        type: string
                      fields:
                        description: Its fields, reduced to what is needed to read or write
                          one.
                        items:
                          $ref: '#/$defs/FieldDescription'
                        title: Fields
                        type: array
                      returned:
                        description: How many fields are in this response.
                        title: Returned
                        type: integer
                    required:
                    - object_name
                    - label
                    - fields
                    - returned
                    title: DescribeObjectOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Learn which sales stages this org accepts:
                  summary: Learn which sales stages this org accepts
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      object_name: Opportunity
                      label: Opportunity
                      fields:
                      - name: StageName
                        label: Stage
                        type: picklist
                        required: true
                        updateable: true
                        picklist_values:
                        - Qualify
                        - Propose
                        - Closed Won
                        relationship_name: null
                      returned: 1
  /actions/salesforce.get_record:
    post:
      operationId: salesforce_get_record
      summary: Read one Salesforce record by id
      description: "Read one Salesforce record directly by its id, returning either every\
        \ field or only the ones asked for.\n\nUse this when: you hold a record id, from a\
        \ search, from a record you just created, or from a relationship, and want the record\
        \ itself.\nDo not use this when: you do not have the id, in which case search for\
        \ it by name or query for it by condition; or you want several records at once, which\
        \ is salesforce_soql_query. This reads exactly one.\n\nExample -- Read the fields\
        \ you care about\n  call: {\"fields\": [\"Name\", \"Email\", \"Title\"], \"object_name\"\
        : \"Contact\", \"record_id\": \"003xx000004TmiQAAS\"}\n  returns: {\"record\": {\"\
        Email\": \"ada@example.com\", \"Id\": \"003xx000004TmiQAAS\", \"Name\": \"Ada Lovelace\"\
        , \"Title\": \"Chief Analyst\"}}\n\nFailures and what to do:\n- salesforce.record_not_found:\
        \ No record has that id, or it has been deleted. Do not retry with the same id. Search\
        \ for the record by name or email, and tell the user if it no longer exists.\n- connector.invalid_input:\
        \ The id is malformed, or a named field does not exist. Salesforce names the field\
        \ it did not recognise. Call salesforce_describe_object to see the real field names,\
        \ then call again.\n- salesforce.permission_denied: This user may not read that object,\
        \ or one of the fields named. Do not retry. Try again naming fewer fields if only\
        \ one was refused, and report that an administrator must grant access.\n- salesforce.rate_limited:\
        \ The org has spent its API allowance for now. Wait the stated number of seconds,\
        \ then repeat the same call.\n- salesforce.transport_failed: Salesforce did not answer\
        \ in time. Wait briefly and repeat. Reading again is always safe."
      tags:
      - read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Which record, and how much of it.
              properties:
                object_name:
                  description: 'Required. The object, spelled as Salesforce spells it: Contact,
                    Opportunity, Account, Lead, Task, or a custom object ending __c.'
                  maxLength: 80
                  minLength: 1
                  title: Object Name
                  type: string
                record_id:
                  description: 'Required. The record''s Salesforce id. Search for it first
                    if you do not have it. Never guess: a well-formed id that belongs to something
                    else returns that something else, quietly.'
                  maxLength: 18
                  minLength: 15
                  title: Record Id
                  type: string
                fields:
                  default: []
                  description: 'Optional. Which fields to return, named as Salesforce names
                    them: Name, Email, Title. Omit to get every field the object has, which
                    on a real org is dozens of them and mostly empty. Naming the three or
                    four you need keeps the answer readable and cheap.


                    If you do not know what a field is called, call salesforce_describe_object
                    first rather than guessing.'
                  examples:
                  - - Name
                    - Email
                  - - Name
                    - StageName
                    - Amount
                  items:
                    type: string
                  title: Fields
                  type: array
              required:
              - object_name
              - record_id
              title: GetRecordInput
              type: object
            examples:
              Read the fields you care about:
                summary: Read the fields you care about
                value:
                  object_name: Contact
                  record_id: 003xx000004TmiQAAS
                  fields:
                  - Name
                  - Email
                  - Title
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    additionalProperties: false
                    description: The record as Salesforce holds it.
                    properties:
                      record:
                        additionalProperties: true
                        description: The record's fields. Exactly the ones asked for, or all
                          of them if none were named. A field present with a null value is
                          set to nothing; a field absent was not requested.
                        title: Record
                        type: object
                    required:
                    - record
                    title: GetRecordOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Read the fields you care about:
                  summary: Read the fields you care about
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      record:
                        Id: 003xx000004TmiQAAS
                        Name: Ada Lovelace
                        Email: ada@example.com
                        Title: Chief Analyst
  /actions/salesforce.get_related:
    post:
      operationId: salesforce_get_related
      summary: Follow a Salesforce relationship
      description: "Read the records a Salesforce record is attached to, such as a contact's\
        \ account or an opportunity's contact roles.\n\nUse this when: you hold a record and\
        \ need what it points at: the account behind a contact's account id, the contacts\
        \ under an account, the roles on a deal. One call rather than reading an id and then\
        \ reading the record it names.\nDo not use this when: you want the record itself rather\
        \ than what it is attached to; or you need fields from both sides at once, or any\
        \ filtering or sorting, which salesforce_soql_query does with a relationship field\
        \ such as Account.Name. This follows exactly one hop and applies no conditions.\n\n\
        Example -- The account a contact belongs to\n  call: {\"object_name\": \"Contact\"\
        , \"record_id\": \"003xx000004TmiQAAS\", \"relationship\": \"Account\"}\n  returns:\
        \ {\"records\": [{\"Id\": \"001xx000003DGb2AAG\", \"Name\": \"Example Corp\"}], \"\
        returned\": 1}\n\nFailures and what to do:\n- salesforce.record_not_found: No record\
        \ has that id, or the relationship name does not exist. Check the id first by searching\
        \ for the record. If the id is right, the relationship name is wrong: call salesforce_describe_object\
        \ on the starting object and use a relationshipName it actually lists.\n- connector.invalid_input:\
        \ The id is malformed, or the object name is empty. Correct the named field and call\
        \ again.\n- salesforce.permission_denied: This user may not read the object on the\
        \ other side. Do not retry. Reading a contact does not imply permission to read its\
        \ account. Report which object was refused.\n- salesforce.rate_limited: The org has\
        \ spent its API allowance for now. Wait the stated number of seconds, then repeat\
        \ the same call.\n- salesforce.transport_failed: Salesforce did not answer in time.\
        \ Wait briefly and repeat. Reading again is always safe."
      tags:
      - read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Which record, and which relationship to follow.
              properties:
                object_name:
                  description: 'Required. The object you are starting from, spelled as Salesforce
                    spells it: Contact, Opportunity, Account, or a custom object ending __c.'
                  maxLength: 80
                  minLength: 1
                  title: Object Name
                  type: string
                record_id:
                  description: Required. The record to start from. Search for it first if
                    you do not have the id; never guess one, because a valid-looking id may
                    belong to a different record entirely.
                  maxLength: 18
                  minLength: 15
                  title: Record Id
                  type: string
                relationship:
                  description: 'Required. The relationship to follow, named as Salesforce
                    names it. Following a lookup field drops the Id: a Contact''s AccountId
                    is followed as ''Account''. Child collections keep their plural name,
                    such as ''Contacts'' on an Account or ''OpportunityContactRoles'' on an
                    Opportunity.


                    If you are unsure what a relationship is called, call salesforce_describe_object
                    on the starting object and read its relationshipName values rather than
                    guessing.'
                  examples:
                  - Account
                  - Contacts
                  - OpportunityContactRoles
                  maxLength: 80
                  minLength: 1
                  title: Relationship
                  type: string
              required:
              - object_name
              - record_id
              - relationship
              title: GetRelatedInput
              type: object
            examples:
              The account a contact belongs to:
                summary: The account a contact belongs to
                value:
                  object_name: Contact
                  record_id: 003xx000004TmiQAAS
                  relationship: Account
              The contacts under an account:
                summary: The contacts under an account
                value:
                  object_name: Account
                  record_id: 001xx000003DGb2AAG
                  relationship: Contacts
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    additionalProperties: false
                    description: What the relationship led to.
                    properties:
                      records:
                        description: What was found. A lookup returns exactly one record;
                          a child collection returns many, or none. Empty means the relationship
                          exists but nothing is attached, which is different from the relationship
                          not existing at all.
                        items:
                          additionalProperties: true
                          type: object
                        title: Records
                        type: array
                      returned:
                        description: How many records are in this response.
                        title: Returned
                        type: integer
                    required:
                    - records
                    - returned
                    title: GetRelatedOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                The account a contact belongs to:
                  summary: The account a contact belongs to
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      records:
                      - Id: 001xx000003DGb2AAG
                        Name: Example Corp
                      returned: 1
                The contacts under an account:
                  summary: The contacts under an account
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      records:
                      - Id: 003xx000004TmiQAAS
                        Name: Ada Lovelace
                      - Id: 003xx000004TmiRAAS
                        Name: Grace Hopper
                      returned: 2
  /actions/salesforce.link_contact_to_opportunity:
    post:
      operationId: salesforce_link_contact_to_opportunity
      summary: Attach a contact to a Salesforce opportunity
      description: "Attach an existing contact to an existing opportunity, so the deal records\
        \ who it is for.\n\nUse this when: you have just created an opportunity for a particular\
        \ person and hold both ids; or an existing deal is missing the contact it belongs\
        \ to.\nDo not use this when: the opportunity does not exist yet, in which case create\
        \ it first and use the id it returns; or you do not have the contact's id, in which\
        \ case search for them rather than guessing. This tool only links two records that\
        \ already exist, and creates neither.\n\nExample -- Attach the contact to a deal just\
        \ created\n  call: {\"approved\": true, \"contact_id\": \"003xx000004TmiQAAS\", \"\
        idempotency_key\": \"f6a7b8c9-d0e1-4f2a-9b3c-5d6e7f8a9b0c\", \"opportunity_id\": \"\
        006xx000004TmiQAAS\"}\n  returns: {\"contact_id\": \"003xx000004TmiQAAS\", \"id\"\
        : \"00Kxx0000012345AAA\", \"linked\": true, \"opportunity_id\": \"006xx000004TmiQAAS\"\
        }\n\nFailures and what to do:\n- salesforce.record_not_found: Either the opportunity\
        \ or the contact does not exist. Do not retry with the same ids. Search for whichever\
        \ record is missing, and tell the user if it has been deleted. The error names which\
        \ id failed.\n- connector.invalid_input: An id is malformed, or the two ids are the\
        \ wrong way round. Check that opportunity_id starts 006 and contact_id starts 003.\
        \ Correct them and call again with the same idempotency key.\n- salesforce.conflict:\
        \ This contact already has a role on this opportunity. Do not retry. The link you\
        \ wanted already exists, so report that the contact is already attached rather than\
        \ treating it as a failure.\n- salesforce.permission_denied: This Salesforce user\
        \ may not create contact roles. Do not retry. Report that the profile lacks Create\
        \ on OpportunityContactRole and an administrator must grant it.\n- salesforce.rate_limited:\
        \ The org has spent its API allowance for now. Wait the stated number of seconds,\
        \ then repeat with the same key.\n- salesforce.transport_failed: The request did not\
        \ complete, so the link may or may not exist. Repeat with the identical idempotency\
        \ key. Attaching the same person twice would put them on the deal twice, and the key\
        \ is what prevents it."
      tags:
      - write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Which contact, and which deal.
              properties:
                opportunity_id:
                  description: 'Required. The deal to attach someone to, id starting 006.
                    If you have just created the opportunity, this is the id it returned.
                    If you do not have it, do not guess: create the opportunity first, or
                    search for it if it already exists.'
                  maxLength: 18
                  minLength: 15
                  title: Opportunity Id
                  type: string
                contact_id:
                  description: 'Required. The person to attach, id starting 003. Search for
                    the contact by name or email if you do not have their id. Never guess
                    an id: a valid-looking one may belong to somebody else, and this would
                    attach the wrong person to the deal.'
                  maxLength: 18
                  minLength: 15
                  title: Contact Id
                  type: string
                idempotency_key:
                  description: 'A unique id you generate for this logical write, for example
                    a UUID. Required. If you retry this call after a timeout or an unclear
                    failure, send the identical value: the connector recognises it and returns
                    the original outcome instead of writing a second record. Generate a new
                    value only when you genuinely intend a separate record.'
                  minLength: 8
                  title: Idempotency Key
                  type: string
                approved:
                  default: false
                  description: 'Optional, defaults to false. Set to true only after a person
                    has seen and confirmed this write. A write arriving without it is refused,
                    and the refusal says so. It is declared here because a tool must not ask
                    for an argument its own schema does not offer: a caller working from the
                    schema alone would have no way to supply it.'
                  title: Approved
                  type: boolean
                role:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  description: 'Optional. What part this person plays, for example ''Decision
                    Maker'' or ''Economic Buyer''. Roles are a picklist configured per org,
                    so omit this unless the user named one: Salesforce then applies the org''s
                    own default rather than rejecting a value invented here.'
                  title: Role
              required:
              - opportunity_id
              - contact_id
              - idempotency_key
              title: LinkContactToOpportunityInput
              type: object
            examples:
              Attach the contact to a deal just created:
                summary: Attach the contact to a deal just created
                value:
                  opportunity_id: 006xx000004TmiQAAS
                  contact_id: 003xx000004TmiQAAS
                  idempotency_key: f6a7b8c9-d0e1-4f2a-9b3c-5d6e7f8a9b0c
                  approved: true
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    additionalProperties: false
                    description: The link that now exists.
                    properties:
                      id:
                        description: Record id of the contact role, starting 00K.
                        title: Id
                        type: string
                      opportunity_id:
                        description: The deal the contact is now attached to.
                        title: Opportunity Id
                        type: string
                      contact_id:
                        description: The person attached.
                        title: Contact Id
                        type: string
                      linked:
                        description: True if this call created the link. False means the identical
                          idempotency key had already created it and this is the original
                          outcome, not a second role.
                        title: Linked
                        type: boolean
                    required:
                    - id
                    - opportunity_id
                    - contact_id
                    - linked
                    title: LinkContactToOpportunityOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Attach the contact to a deal just created:
                  summary: Attach the contact to a deal just created
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      id: 00Kxx0000012345AAA
                      opportunity_id: 006xx000004TmiQAAS
                      contact_id: 003xx000004TmiQAAS
                      linked: true
  /actions/salesforce.list_tools:
    post:
      operationId: salesforce_list_tools
      summary: List the Salesforce tools for reading or for writing
      description: "Name the tools that read Salesforce, or the tools that change it, each\
        \ with what it is for and what it needs.\n\nUse this when: you are about to do something\
        \ in Salesforce and want the shortlist for that half rather than weighing every tool:\
        \ ask for 'read' to answer a question, 'write' to make something happen. Cheap, changes\
        \ nothing, and safe to call first whenever the right tool is not obvious.\nDo not\
        \ use this when: you already know which tool you want, in which case call salesforce_tool_schema\
        \ for its fields or simply call the tool; or you want the fields and types of one\
        \ tool, which is salesforce_tool_schema. This lists tools and never touches Salesforce\
        \ data.\n\nExample -- Which tools change Salesforce\n  call: {\"kind\": \"write\"\
        }\n  returns: {\"kind\": \"write\", \"next_action\": \"Call salesforce_tool_schema\
        \ with the tool_name you chose to see its fields and the exact type each one expects.\"\
        , \"returned\": 1, \"tools\": [{\"changes_data\": true, \"name\": \"salesforce_create_contact\"\
        , \"needs_approval\": true, \"purpose\": \"Create a new contact and return its record\
        \ id.\", \"required_inputs\": [\"last_name\", \"idempotency_key\"], \"use_when\":\
        \ \"the user wants somebody added to Salesforce.\"}]}\n\nFailures and what to do:\n\
        - connector.invalid_input: kind was not one of read, write, or all. Send exactly one\
        \ of those three words in lower case."
      tags:
      - read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Which half of the connector to list.
              properties:
                kind:
                  description: 'Required. Exactly one of: read, write, all.


                    Send ''read'' when the user is asking a question and nothing should change:
                    finding, listing, counting, describing. Send ''write'' when the user is
                    asking for something to happen: creating, updating, linking, logging.
                    Send ''all'' only when you genuinely cannot tell which of the two it is.'
                  examples:
                  - read
                  - write
                  pattern: ^(read|write|all)$
                  title: Kind
                  type: string
              required:
              - kind
              title: ListToolsInput
              type: object
            examples:
              Which tools change Salesforce:
                summary: Which tools change Salesforce
                value:
                  kind: write
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    $defs:
                      ToolSummary:
                        additionalProperties: false
                        description: One tool, in a line.
                        properties:
                          name:
                            description: The tool name to call, exactly as written.
                            title: Name
                            type: string
                          purpose:
                            description: What it does, in one sentence.
                            title: Purpose
                            type: string
                          use_when:
                            description: The situation it is the right choice for.
                            title: Use When
                            type: string
                          required_inputs:
                            description: The fields that must be supplied. Types come from
                              tool_schema.
                            items:
                              type: string
                            title: Required Inputs
                            type: array
                          changes_data:
                            description: True when calling it alters Salesforce.
                            title: Changes Data
                            type: boolean
                          needs_approval:
                            description: True when the user must confirm before it will run.
                            title: Needs Approval
                            type: boolean
                        required:
                        - name
                        - purpose
                        - use_when
                        - required_inputs
                        - changes_data
                        - needs_approval
                        title: ToolSummary
                        type: object
                    additionalProperties: false
                    description: The shortlist, and what to do with it.
                    properties:
                      kind:
                        description: Which half was listed.
                        title: Kind
                        type: string
                      tools:
                        description: Every matching tool, in a stable order.
                        items:
                          $ref: '#/$defs/ToolSummary'
                        title: Tools
                        type: array
                      returned:
                        description: How many tools are listed here.
                        title: Returned
                        type: integer
                      next_action:
                        description: What to do next. Always present, because a shortlist
                          is never the answer to anything on its own.
                        title: Next Action
                        type: string
                    required:
                    - kind
                    - tools
                    - returned
                    - next_action
                    title: ListToolsOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Which tools change Salesforce:
                  summary: Which tools change Salesforce
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      kind: write
                      tools:
                      - name: salesforce_create_contact
                        purpose: Create a new contact and return its record id.
                        use_when: the user wants somebody added to Salesforce.
                        required_inputs:
                        - last_name
                        - idempotency_key
                        changes_data: true
                        needs_approval: true
                      returned: 1
                      next_action: Call salesforce_tool_schema with the tool_name you chose
                        to see its fields and the exact type each one expects.
  /actions/salesforce.search_contact:
    post:
      operationId: salesforce_search_contact
      summary: Search Salesforce contacts
      description: "Search Salesforce for existing contacts by name, email, phone, or account\
        \ name, and return the matches with their record ids.\n\nUse this when: you need a\
        \ contact's Salesforce id; you want to check whether a person already exists before\
        \ creating them; or the user named someone and you need to confirm which record they\
        \ meant.\nDo not use this when: you already hold the contact id, in which case act\
        \ on it directly; or you want to create, change, or annotate a record, which the write\
        \ actions do.\n\nExample -- Find someone by name\n  call: {\"query\": \"Ada Lovelace\"\
        }\n  returns: {\"contacts\": [{\"account_id\": \"001xx000003DGb2AAG\", \"email\":\
        \ \"ada@example.com\", \"id\": \"003xx000004TmiQAAS\", \"name\": \"Ada Lovelace\"\
        , \"phone\": \"+973 1234 5678\", \"title\": \"Chief Analyst\"}], \"returned\": 1}\n\
        \nFailures and what to do:\n- connector.invalid_input: The search text is shorter\
        \ than two characters. Ask the user for more of the name or email, then call again.\n\
        - salesforce.permission_denied: This Salesforce user may not read contacts. Do not\
        \ retry. Tell the user their Salesforce profile lacks read access to Contact and that\
        \ an administrator must grant it.\n- salesforce.rate_limited: The org has spent its\
        \ API allowance for now. Wait for the stated number of seconds, then repeat the same\
        \ call.\n- salesforce.transport_failed: Salesforce did not answer in time. Wait briefly\
        \ and repeat the same call. Reading again is always safe.\n- salesforce.authentication_failed:\
        \ The connector's Salesforce session is invalid or expired. Do not retry. Report that\
        \ the connector needs to re-authenticate; its credentials may be wrong or expired."
      tags:
      - read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: What to search for.
              properties:
                query:
                  description: 'Required. Text to look for across contact name, email, phone,
                    and account name, for example ''Ada Lovelace'', ''ada@example.com'', or
                    ''+973 1234 5678''. Two characters minimum. This is a search, not a filter:
                    it matches whole words, and a partial word may not match. Do not put SOQL
                    or SOSL syntax here; it is sent as data, never as a query.'
                  examples:
                  - Ada Lovelace
                  - ada@example.com
                  maxLength: 200
                  minLength: 2
                  title: Query
                  type: string
                limit:
                  default: 20
                  description: Optional. How many contacts to return, 1 to 200. Defaults to
                    20. Ask for more only when you intend to read them all; large results
                    cost context and rarely help. Written in digits.
                  examples:
                  - 20
                  maximum: 200
                  minimum: 1
                  title: Limit
                  type: integer
                cursor:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  description: 'Optional. To read the next page, send back the exact cursor
                    from the previous result. Treat it as opaque: do not parse or edit it.
                    Omit it for the first page. When a result comes back without a cursor,
                    there are no more pages.'
                  title: Cursor
              required:
              - query
              title: SearchContactInput
              type: object
            examples:
              Find someone by name:
                summary: Find someone by name
                value:
                  query: Ada Lovelace
              Read the second page:
                summary: Read the second page
                value:
                  query: Example Corp
                  limit: 3
                  cursor: '3'
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    $defs:
                      ContactSummary:
                        additionalProperties: false
                        description: One contact, reduced to the fields a caller acts on.
                        properties:
                          id:
                            description: Salesforce record id, for example 003xx000004TmiQAAS.
                            title: Id
                            type: string
                          name:
                            description: Full name as Salesforce holds it.
                            title: Name
                            type: string
                          email:
                            anyOf:
                            - type: string
                            - type: 'null'
                            default: null
                            description: Primary email, if any.
                            title: Email
                          phone:
                            anyOf:
                            - type: string
                            - type: 'null'
                            default: null
                            description: Primary phone, if any.
                            title: Phone
                          account_id:
                            anyOf:
                            - type: string
                            - type: 'null'
                            default: null
                            description: Owning account id, if the contact has one.
                            title: Account Id
                          title:
                            anyOf:
                            - type: string
                            - type: 'null'
                            default: null
                            description: Job title, if set.
                            title: Title
                        required:
                        - id
                        - name
                        title: ContactSummary
                        type: object
                    additionalProperties: false
                    description: Contacts that matched, and where the page stopped.
                    properties:
                      contacts:
                        description: Matches, most relevant first. Empty when nothing matched.
                        items:
                          $ref: '#/$defs/ContactSummary'
                        title: Contacts
                        type: array
                      returned:
                        description: How many contacts are in this response.
                        title: Returned
                        type: integer
                      next_cursor:
                        anyOf:
                        - type: string
                        - type: 'null'
                        default: null
                        description: Send back verbatim for the next page. Absent means no
                          more pages.
                        title: Next Cursor
                    required:
                    - contacts
                    - returned
                    title: SearchContactOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Find someone by name:
                  summary: Find someone by name
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      contacts:
                      - id: 003xx000004TmiQAAS
                        name: Ada Lovelace
                        email: ada@example.com
                        phone: +973 1234 5678
                        account_id: 001xx000003DGb2AAG
                        title: Chief Analyst
                      returned: 1
                Read the second page:
                  summary: Read the second page
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      contacts:
                      - id: 003xx000004TmiRAAS
                        name: Grace Hopper
                        title: CTO
                      returned: 1
  /actions/salesforce.search_records:
    post:
      operationId: salesforce_search_records
      summary: Search any Salesforce object by words
      description: "Find records of any object by free text, the way a search box finds them,\
        \ and return the fields that were asked for.\n\nUse this when: the user named something\
        \ in words and you need to find it: an account by company name, a lead by surname,\
        \ a case by its subject. Use it to turn a name into a record id before a tool that\
        \ needs one.\nDo not use this when: the object is Contact, which is salesforce_search_contact\
        \ and returns the fields the contact tools expect; the user described a condition\
        \ rather than words, such as everything closing this month, which is salesforce_soql_query;\
        \ or you already hold the record id, in which case salesforce_get_record reads it\
        \ directly.\n\nExample -- Find an account by name\n  call: {\"fields\": [\"Id\", \"\
        Name\", \"Industry\"], \"object_name\": \"Account\", \"query\": \"Example Corp\"}\n\
        \  returns: {\"next_cursor\": null, \"records\": [{\"Id\": \"001xx000003DGb2AAG\"\
        , \"Industry\": \"Technology\", \"Name\": \"Example Corp\"}], \"returned\": 1}\n\n\
        Failures and what to do:\n- connector.invalid_input: The object does not exist, one\
        \ of the named fields does not exist on it, or the search term is too short. Search\
        \ for at least two characters. If a field was rejected, call salesforce_describe_object\
        \ on the object and use names it actually lists rather than retrying the same list.\n\
        - salesforce.permission_denied: This user may not search that object. Do not retry.\
        \ Report which object was refused and that an administrator must grant read access.\n\
        - salesforce.rate_limited: The org has spent its API allowance for now. Wait the stated\
        \ number of seconds, then repeat the same call.\n- salesforce.transport_failed: Salesforce\
        \ did not answer in time. Wait briefly and repeat. Searching changes nothing, so retrying\
        \ is safe."
      tags:
      - read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: What to look for, and where.
              properties:
                object_name:
                  description: 'Required. The object to search, spelled as Salesforce spells
                    it: Account, Lead, Opportunity, Case, Task, or a custom object ending
                    __c. For Contact use salesforce_search_contact instead, which returns
                    the contact fields the contact tools need.'
                  examples:
                  - Account
                  - Lead
                  - Opportunity
                  maxLength: 80
                  minLength: 1
                  title: Object Name
                  type: string
                query:
                  description: 'Required. The words to search for, as the user said them:
                    a company name, a subject line, part of a title. This matches the way
                    a search box matches, not the way a filter matches, so a partial word
                    finds records containing it.


                    For a condition rather than words, such as a date range or an amount over
                    a threshold, use salesforce_soql_query.'
                  examples:
                  - Example Corp
                  - renewal
                  maxLength: 200
                  minLength: 2
                  title: Query
                  type: string
                fields:
                  default:
                  - Id
                  - Name
                  description: 'Optional, defaults to Id and Name. The fields to return, named
                    as Salesforce names them. Not every object has Name: a Task calls it Subject,
                    and asking for a field an object does not have fails the search. Call
                    salesforce_describe_object first if you are unsure.'
                  examples:
                  - - Id
                    - Name
                    - Industry
                  - - Id
                    - Subject
                    - Status
                  items:
                    type: string
                  maxItems: 25
                  title: Fields
                  type: array
                limit:
                  default: 20
                  description: Optional, defaults to 20. How many records to return at most,
                    written in digits.
                  examples:
                  - 20
                  maximum: 200
                  minimum: 1
                  title: Limit
                  type: integer
                cursor:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  description: Optional. To read the next page, send back the exact cursor
                    from the previous result. Treat it as opaque. Omit it for the first page;
                    a result with no cursor is the last page.
                  title: Cursor
              required:
              - object_name
              - query
              title: SearchRecordsInput
              type: object
            examples:
              Find an account by name:
                summary: Find an account by name
                value:
                  object_name: Account
                  query: Example Corp
                  fields:
                  - Id
                  - Name
                  - Industry
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    additionalProperties: false
                    description: What the search found.
                    properties:
                      records:
                        description: The matching records, each holding the fields that were
                          asked for. Empty means nothing matched, which for a search is an
                          answer rather than a failure.
                        items:
                          additionalProperties: true
                          type: object
                        title: Records
                        type: array
                      returned:
                        description: How many records are in this response.
                        title: Returned
                        type: integer
                      next_cursor:
                        anyOf:
                        - type: string
                        - type: 'null'
                        default: null
                        description: Send back verbatim for the next page. Absent means no
                          more pages.
                        title: Next Cursor
                    required:
                    - records
                    - returned
                    title: SearchRecordsOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Find an account by name:
                  summary: Find an account by name
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      records:
                      - Id: 001xx000003DGb2AAG
                        Name: Example Corp
                        Industry: Technology
                      returned: 1
                      next_cursor: null
  /actions/salesforce.soql_query:
    post:
      operationId: salesforce_soql_query
      summary: Query Salesforce with SOQL
      description: "Run a read-only SOQL query against any Salesforce object, to list, filter,\
        \ sort, or count records.\n\nUse this when: the user described a condition rather\
        \ than a name: how many of something there are, which records match a filter, the\
        \ newest or largest few, or anything about an object other than Contact and Opportunity.\n\
        Do not use this when: the user named a person and you are trying to find them, which\
        \ is the search action and matches fuzzily where this matches exactly; or you already\
        \ hold the record id, in which case read it directly. This tool cannot change anything,\
        \ so never reach for it to create or update.\n\nExample -- Count something\n  call:\
        \ {\"soql\": \"SELECT COUNT() FROM Contact WHERE LastName LIKE '%Demo'\"}\n  returns:\
        \ {\"records\": [], \"returned\": 0, \"total_size\": 7}\n\nFailures and what to do:\n\
        - connector.invalid_input: The statement is not a SELECT, or Salesforce rejected the\
        \ SOQL itself: a bad field name, object, or syntax. This endpoint only reads, so anything\
        \ other than a SELECT must be rewritten as one. If the SOQL was rejected, the error\
        \ names the position and the problem; a field that does not exist is the usual cause,\
        \ so call salesforce_describe_object on the object to see its real field names rather\
        \ than guessing again.\n- salesforce.permission_denied: This user may not read that\
        \ object or one of the named fields. Do not retry. Report which object was refused\
        \ and that an administrator must grant read access.\n- salesforce.rate_limited: The\
        \ org has spent its API allowance for now. Wait the stated number of seconds, then\
        \ repeat. Consider adding a tighter LIMIT: a query paging thousands of rows spends\
        \ the allowance quickly.\n- salesforce.transport_failed: Salesforce did not answer\
        \ in time. Wait briefly and repeat the same query. Reading again is always safe. A\
        \ query that repeatedly times out is usually too broad; add a WHERE clause or a smaller\
        \ LIMIT."
      tags:
      - read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: The question, written in SOQL.
              properties:
                soql:
                  description: 'Required. A SOQL SELECT statement. Compose it from what the
                    user asked for: they describe a condition in words and you turn it into
                    the query.


                    SOQL is not SQL. There are no joins and no SELECT *, so name every field
                    you want. Related fields are reached through the relationship, as in Account.Name.
                    Date literals are built in and worth using: THIS_MONTH, LAST_N_DAYS:30,
                    TODAY.


                    Only SELECT is accepted; the endpoint cannot write, and anything else
                    is refused before it is sent. If you do not add a LIMIT one is added for
                    you, because an unbounded query pages an entire object and spends the
                    org''s API allowance.


                    Examples: SELECT Id, Name, Email FROM Contact WHERE LastName LIKE ''%Demo''
                    ORDER BY CreatedDate DESC LIMIT 20 -- or -- SELECT COUNT() FROM Opportunity
                    WHERE Amount > 50000 AND CloseDate = THIS_MONTH'
                  examples:
                  - SELECT Id, Name, Email FROM Contact ORDER BY CreatedDate DESC LIMIT 20
                  - SELECT COUNT() FROM Opportunity WHERE CloseDate = THIS_MONTH
                  maxLength: 4000
                  minLength: 10
                  title: Soql
                  type: string
                cursor:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  description: 'Optional. To read the next page, send back the exact cursor
                    from the previous result. Treat it as opaque: do not parse or edit it.
                    Omit it for the first page. A result with no cursor is the last page.
                    When paging, send the same soql as well.'
                  title: Cursor
              required:
              - soql
              title: SoqlQueryInput
              type: object
            examples:
              Count something:
                summary: Count something
                value:
                  soql: SELECT COUNT() FROM Contact WHERE LastName LIKE '%Demo'
              List with a filter and an order:
                summary: List with a filter and an order
                value:
                  soql: SELECT Id, Name, Email FROM Contact WHERE Email LIKE '%example.com'
                    ORDER BY CreatedDate DESC LIMIT 2
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    additionalProperties: false
                    description: What matched, how many there are, and where the page stopped.
                    properties:
                      records:
                        description: The matching rows, each holding exactly the fields the
                          query named. Empty for a COUNT() query, and empty when nothing matched
                          -- read total_size to tell those apart.
                        items:
                          additionalProperties: true
                          type: object
                        title: Records
                        type: array
                      returned:
                        description: How many rows are in this response.
                        title: Returned
                        type: integer
                      total_size:
                        description: How many rows match the query in total, across every
                          page. For a COUNT() query this is the answer and records is empty.
                        title: Total Size
                        type: integer
                      next_cursor:
                        anyOf:
                        - type: string
                        - type: 'null'
                        default: null
                        description: Send back verbatim for the next page. Absent means no
                          more pages.
                        title: Next Cursor
                    required:
                    - records
                    - returned
                    - total_size
                    title: SoqlQueryOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Count something:
                  summary: Count something
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      records: []
                      returned: 0
                      total_size: 7
                List with a filter and an order:
                  summary: List with a filter and an order
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      records:
                      - Id: 003xx000004TmiQAAS
                        Name: Ada Lovelace
                        Email: ada@example.com
                      - Id: 003xx000004TmiRAAS
                        Name: Grace Hopper
                        Email: grace@example.com
                      returned: 2
                      total_size: 7
                      next_cursor: /services/data/v67.0/query/01gxx000000abcd
  /actions/salesforce.tool_schema:
    post:
      operationId: salesforce_tool_schema
      summary: Explain one Salesforce tool's fields and types
      description: "Report one tool's input fields, the exact type each expects, a correct\
        \ example value, and a complete worked call.\n\nUse this when: you have chosen a tool\
        \ and are about to call it, especially one taking a number, a date, or a value from\
        \ a fixed set. Also after a call was rejected for a bad argument, to see what the\
        \ field actually wanted.\nDo not use this when: you do not know which tool you want\
        \ yet, which is salesforce_list_tools; or you want Salesforce's own field names for\
        \ an object, which is salesforce_describe_object. This explains this connector's tools,\
        \ not Salesforce's data.\n\nExample -- Check what a field expects before sending it\n\
        \  call: {\"tool_name\": \"salesforce_create_opportunity\"}\n  returns: {\"changes_data\"\
        : true, \"do_not_use_when\": \"the deal already exists and needs changing.\", \"errors\"\
        : [{\"code\": \"connector.invalid_input\", \"remedy\": \"Send the type named above\
        \ and call again.\", \"when\": \"A field was the wrong type.\"}], \"example_call\"\
        : {\"name\": \"Example Corp - renewal\", \"stage_name\": \"Qualify\"}, \"fields\"\
        : [{\"description\": \"Optional. Value of the deal in the org's currency.\", \"example\"\
        : \"45000\", \"name\": \"amount\", \"required\": false, \"type\": \"a number, written\
        \ in digits\"}], \"needs_approval\": true, \"purpose\": \"Create a sales opportunity\
        \ and return its record id.\", \"tool_name\": \"salesforce_create_opportunity\", \"\
        use_when\": \"the user wants to record a new deal.\"}\n\nFailures and what to do:\n\
        - connector.invalid_input: No tool has that name. The message lists every valid name.\
        \ Use one of those exactly, including the salesforce_ prefix."
      tags:
      - read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Which tool to explain.
              properties:
                tool_name:
                  description: Required. The tool to explain, named exactly as it is published,
                    including the salesforce_ prefix. Call salesforce_list_tools first if
                    you are not sure of the name; a wrong name is answered with the list of
                    right ones.
                  examples:
                  - salesforce_create_opportunity
                  maxLength: 120
                  minLength: 1
                  title: Tool Name
                  type: string
              required:
              - tool_name
              title: ToolSchemaInput
              type: object
            examples:
              Check what a field expects before sending it:
                summary: Check what a field expects before sending it
                value:
                  tool_name: salesforce_create_opportunity
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    $defs:
                      FieldGuide:
                        additionalProperties: false
                        description: One input field, and everything needed to fill it in
                          correctly.
                        properties:
                          name:
                            description: The argument name, spelled exactly.
                            title: Name
                            type: string
                          type:
                            description: 'What to send, in words: text, a number written in
                              digits, a date as YYYY-MM-DD, exactly one of a listed set. Follow
                              this literally. A number means digits, so 45000 and never the
                              word.'
                            title: Type
                            type: string
                          required:
                            description: True when the call fails if this is left out.
                            title: Required
                            type: boolean
                          example:
                            anyOf:
                            - type: string
                            - type: 'null'
                            default: null
                            description: One correct value, written exactly as it should be
                              sent.
                            title: Example
                          description:
                            description: What the field means and how it is used.
                            title: Description
                            type: string
                        required:
                        - name
                        - type
                        - required
                        - description
                        title: FieldGuide
                        type: object
                    additionalProperties: false
                    description: Everything needed to call one tool correctly the first time.
                    properties:
                      tool_name:
                        description: The tool explained.
                        title: Tool Name
                        type: string
                      purpose:
                        description: What it does.
                        title: Purpose
                        type: string
                      use_when:
                        description: When it is the right tool.
                        title: Use When
                        type: string
                      do_not_use_when:
                        description: When it is the wrong tool, and which one is right instead.
                        title: Do Not Use When
                        type: string
                      changes_data:
                        description: True when calling it alters Salesforce.
                        title: Changes Data
                        type: boolean
                      needs_approval:
                        description: True when the call is refused unless approved is true
                          and the user has confirmed it.
                        title: Needs Approval
                        type: boolean
                      fields:
                        description: Every input field, required ones first.
                        items:
                          $ref: '#/$defs/FieldGuide'
                        title: Fields
                        type: array
                      example_call:
                        additionalProperties: true
                        description: A complete, valid set of arguments. Copy its shape.
                        title: Example Call
                        type: object
                      errors:
                        description: What can fail, and what to do about each.
                        items:
                          additionalProperties:
                            type: string
                          type: object
                        title: Errors
                        type: array
                    required:
                    - tool_name
                    - purpose
                    - use_when
                    - do_not_use_when
                    - changes_data
                    - needs_approval
                    - fields
                    - example_call
                    - errors
                    title: ToolSchemaOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Check what a field expects before sending it:
                  summary: Check what a field expects before sending it
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      tool_name: salesforce_create_opportunity
                      purpose: Create a sales opportunity and return its record id.
                      use_when: the user wants to record a new deal.
                      do_not_use_when: the deal already exists and needs changing.
                      changes_data: true
                      needs_approval: true
                      fields:
                      - name: amount
                        type: a number, written in digits
                        required: false
                        example: '45000'
                        description: Optional. Value of the deal in the org's currency.
                      example_call:
                        name: Example Corp - renewal
                        stage_name: Qualify
                      errors:
                      - code: connector.invalid_input
                        when: A field was the wrong type.
                        remedy: Send the type named above and call again.
  /actions/salesforce.update_contact:
    post:
      operationId: salesforce_update_contact
      summary: Update a Salesforce contact
      description: "Change one or more fields on an existing Salesforce contact and return\
        \ the record as it stands afterwards.\n\nUse this when: you hold the contact's record\
        \ id and the user has asked for a detail to be corrected or added, such as a new email,\
        \ phone, title, or account.\nDo not use this when: the person does not exist yet,\
        \ which is the create action; you do not have the record id, in which case search\
        \ first; or you want to record something that happened rather than change the person,\
        \ which is the activity note.\n\nExample -- Change one field, leaving the rest of\
        \ the record alone\n  call: {\"approved\": true, \"contact_id\": \"003xx000004TmiQAAS\"\
        , \"idempotency_key\": \"b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e\", \"title\": \"Chief\
        \ Analyst\"}\n  returns: {\"changed_fields\": [\"title\"], \"id\": \"003xx000004TmiQAAS\"\
        , \"name\": \"Ada Lovelace\", \"title\": \"Chief Analyst\"}\n\nFailures and what to\
        \ do:\n- salesforce.record_not_found: No contact has that id, or it has been deleted.\
        \ Do not retry with the same id. Search for the contact by name or email to find the\
        \ right one, and tell the user if it no longer exists.\n- connector.invalid_input:\
        \ No changeable field was given, or a value was malformed. Name at least one field\
        \ to change and correct any malformed value, then call again with the same idempotency\
        \ key.\n- salesforce.permission_denied: This Salesforce user may not edit this contact\
        \ or one of these fields. Do not retry. Some fields are read-only for some profiles.\
        \ Report which field was refused and that an administrator must grant access.\n- salesforce.conflict:\
        \ The record is locked, in an approval process, or was changed concurrently. Do not\
        \ retry immediately. Read the contact again to see its current state, and tell the\
        \ user it is locked if it still is.\n- salesforce.rate_limited: The org has spent\
        \ its API allowance for now. Wait the stated number of seconds, then repeat the call\
        \ with the same key.\n- salesforce.transport_failed: The request did not complete,\
        \ so the change may or may not have applied. Repeat the call with the identical idempotency\
        \ key. Setting the same fields twice is harmless, and the key prevents any doubt."
      tags:
      - write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Which contact to change, and what to change on it.
              properties:
                contact_id:
                  description: 'Required. Salesforce record id of the contact to change, starting
                    003, for example 003xx000004TmiQAAS. Find it with the search action if
                    you do not have it. Never guess an id: a wrong one either fails or edits
                    somebody else''s record.'
                  maxLength: 18
                  minLength: 15
                  title: Contact Id
                  type: string
                idempotency_key:
                  description: 'A unique id you generate for this logical write, for example
                    a UUID. Required. If you retry this call after a timeout or an unclear
                    failure, send the identical value: the connector recognises it and returns
                    the original outcome instead of writing a second record. Generate a new
                    value only when you genuinely intend a separate record.'
                  minLength: 8
                  title: Idempotency Key
                  type: string
                approved:
                  default: false
                  description: 'Optional, defaults to false. Set to true only after a person
                    has seen and confirmed this write. A write arriving without it is refused,
                    and the refusal says so. It is declared here because a tool must not ask
                    for an argument its own schema does not offer: a caller working from the
                    schema alone would have no way to supply it.'
                  title: Approved
                  type: boolean
                first_name:
                  anyOf:
                  - maxLength: 40
                    type: string
                  - type: 'null'
                  default: null
                  description: Optional. New given name.
                  title: First Name
                last_name:
                  anyOf:
                  - maxLength: 80
                    type: string
                  - type: 'null'
                  default: null
                  description: Optional. New family name.
                  title: Last Name
                email:
                  anyOf:
                  - format: email
                    type: string
                  - type: 'null'
                  default: null
                  description: Optional. The new email address.
                  examples:
                  - ada@example.com
                  title: Email
                phone:
                  anyOf:
                  - maxLength: 40
                    type: string
                  - type: 'null'
                  default: null
                  description: Optional. New phone number.
                  title: Phone
                title:
                  anyOf:
                  - maxLength: 128
                    type: string
                  - type: 'null'
                  default: null
                  description: Optional. New job title.
                  title: Title
                account_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  description: Optional. Move the contact to this account, id 001...
                  title: Account Id
              required:
              - contact_id
              - idempotency_key
              title: UpdateContactInput
              type: object
            examples:
              Change one field, leaving the rest of the record alone:
                summary: Change one field, leaving the rest of the record alone
                value:
                  contact_id: 003xx000004TmiQAAS
                  title: Chief Analyst
                  idempotency_key: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                  approved: true
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    additionalProperties: false
                    description: The contact as it stands after the change.
                    properties:
                      id:
                        description: Record id of the contact.
                        title: Id
                        type: string
                      name:
                        description: Full name after the change.
                        title: Name
                        type: string
                      changed_fields:
                        description: The fields this call actually set.
                        items:
                          type: string
                        title: Changed Fields
                        type: array
                      email:
                        anyOf:
                        - type: string
                        - type: 'null'
                        default: null
                        description: Email after the change.
                        title: Email
                      phone:
                        anyOf:
                        - type: string
                        - type: 'null'
                        default: null
                        description: Phone after the change.
                        title: Phone
                      title:
                        anyOf:
                        - type: string
                        - type: 'null'
                        default: null
                        description: Title after the change.
                        title: Title
                    required:
                    - id
                    - name
                    - changed_fields
                    title: UpdateContactOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Change one field, leaving the rest of the record alone:
                  summary: Change one field, leaving the rest of the record alone
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      id: 003xx000004TmiQAAS
                      name: Ada Lovelace
                      changed_fields:
                      - title
                      title: Chief Analyst
  /actions/salesforce.update_record:
    post:
      operationId: salesforce_update_record
      summary: Update a Salesforce record
      description: "Change named fields on an existing record of any object, then read back\
        \ what they now hold.\n\nUse this when: the user wants to correct or move on something\
        \ that already exists: an account's industry, a deal's stage, a case's status. You\
        \ must already know the record id and the Salesforce field names.\nDo not use this\
        \ when: the record is a Contact, which is salesforce_update_contact and takes plain\
        \ field names; the record does not exist yet, which is a create tool; or you are not\
        \ certain the field name is right, in which case call salesforce_describe_object first\
        \ rather than trying a name to see.\n\nExample -- Move a deal to a new stage\n  call:\
        \ {\"approved\": true, \"fields\": {\"StageName\": \"Negotiate\"}, \"idempotency_key\"\
        : \"f1e2d3c4-b5a6-4978-8a9b-0c1d2e3f4a5b\", \"object_name\": \"Opportunity\", \"record_id\"\
        : \"006xx000004TmiQAAS\"}\n  returns: {\"changed_fields\": [\"StageName\"], \"id\"\
        : \"006xx000004TmiQAAS\", \"object_name\": \"Opportunity\", \"record\": {\"Id\": \"\
        006xx000004TmiQAAS\", \"StageName\": \"Negotiate\"}}\n\nFailures and what to do:\n\
        - salesforce.record_not_found: No record of that object has that id. Search for the\
        \ record again rather than retrying. An id from a different object gives this same\
        \ error.\n- connector.invalid_input: A field name does not exist, or a value is not\
        \ one this org accepts. Call salesforce_describe_object on this object, use a field\
        \ name it lists, and for a picklist use one of the values it reports. Then call again\
        \ with the same idempotency key.\n- salesforce.permission_denied: This user may not\
        \ edit that object, or that field on it. Do not retry. Report which field was refused\
        \ and that an administrator must grant edit access.\n- salesforce.rate_limited: The\
        \ org has spent its API allowance for now. Wait the stated number of seconds, then\
        \ repeat with the same idempotency key.\n- salesforce.transport_failed: Salesforce\
        \ did not answer in time. Repeat with the identical idempotency key. The change may\
        \ already have been applied, and the key is what stops it being applied twice.\n-\
        \ connector.escalate_to_human: The update failed three times in a row and will not\
        \ succeed by retrying. Stop calling this tool. Tell the user it must be done by hand\
        \ and how."
      tags:
      - write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Which record to change, and to what.
              properties:
                object_name:
                  description: 'Required. The object the record belongs to, spelled as Salesforce
                    spells it: Account, Lead, Opportunity, Case, or a custom object ending
                    __c. For Contact use salesforce_update_contact, which takes plain field
                    names and needs no lookup first.'
                  examples:
                  - Account
                  - Opportunity
                  maxLength: 80
                  minLength: 1
                  title: Object Name
                  type: string
                record_id:
                  description: 'Required. The record to change. Find it first with salesforce_search_records
                    if you do not have the id. Never guess one: a valid-looking id belongs
                    to some other record, and this tool would change it.'
                  maxLength: 18
                  minLength: 15
                  title: Record Id
                  type: string
                fields:
                  additionalProperties: true
                  description: 'Required. The fields to set, keyed by Salesforce''s own API
                    names, not plain English: Industry, StageName, CloseDate, Description.
                    Call salesforce_describe_object on this object first if you are not certain
                    of a name or of the values a picklist accepts.


                    Only the fields named here are touched; everything else on the record
                    is left alone. Do not send a field to clear it unless the user asked for
                    it to be cleared.'
                  examples:
                  - Industry: Technology
                  - StageName: Closed Won
                  minProperties: 1
                  title: Fields
                  type: object
                idempotency_key:
                  description: Required. A unique string for this specific change. Reuse the
                    same one when retrying so the same edit is not applied twice; generate
                    a new one for a genuinely different change.
                  maxLength: 128
                  minLength: 8
                  title: Idempotency Key
                  type: string
                approved:
                  default: false
                  description: Optional, defaults to false, but the call is refused without
                    it. Confirmation that the user asked for this change. This writes to a
                    record that already exists and there is no undo.
                  title: Approved
                  type: boolean
              required:
              - object_name
              - record_id
              - fields
              - idempotency_key
              title: UpdateRecordInput
              type: object
            examples:
              Move a deal to a new stage:
                summary: Move a deal to a new stage
