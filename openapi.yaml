  /actions/salesforce.upsert_record:
    post:
      operationId: salesforce_upsert_record
      summary: Create or update a Salesforce record by external id
      description: "Write a record identified by an outside system's id: creates it if that\
        \ id is new to Salesforce, updates it if a record already carries it.\n\nUse this\
        \ when: you are syncing records from another system that has its own identifiers,\
        \ and you cannot tell whether Salesforce already holds this one. Also when a write\
        \ must be safe to repeat: the same external id always lands on the same record, however\
        \ many times it is sent.\nDo not use this when: the user asked to add somebody new,\
        \ which is salesforce_create_contact and will not silently overwrite; the user asked\
        \ to change a record you already hold the id of, which is salesforce_update_record;\
        \ or you do not have an external id from a real system. Do not invent an external\
        \ id to use this tool: a value that happens to exist overwrites that record.\n\nExample\
        \ -- Sync a contact from another system\n  call: {\"approved\": true, \"external_id_field\"\
        : \"External_Id__c\", \"external_id_value\": \"CRM-4471\", \"fields\": {\"Email\"\
        : \"ada@example.com\", \"LastName\": \"Lovelace\"}, \"idempotency_key\": \"b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e\"\
        , \"object_name\": \"Contact\"}\n  returns: {\"created\": true, \"external_id_value\"\
        : \"CRM-4471\", \"id\": \"003xx000004TmiQAAS\", \"object_name\": \"Contact\"}\n\n\
        Failures and what to do:\n- connector.invalid_input: The field is not marked External\
        \ Id on this object, or a field name or picklist value in the write is not one this\
        \ org accepts. Call salesforce_describe_object and use a field it lists. Only a field\
        \ configured as an External Id can be used here; if none exists, an administrator\
        \ must create one, and until then use salesforce_update_record with the Salesforce\
        \ id instead.\n- salesforce.conflict: More than one record already carries that external\
        \ id. Do not retry. The org has duplicate data that only a person can resolve. Report\
        \ the external id and that it matches several records.\n- salesforce.permission_denied:\
        \ This user may not create or edit that object, or see the external id field. Do not\
        \ retry. Field-level security hides the external id field even when the object is\
        \ writable. Report which was refused.\n- salesforce.rate_limited: The org has spent\
        \ its API allowance for now. Wait the stated number of seconds, then repeat the same\
        \ call.\n- salesforce.transport_failed: Salesforce did not answer in time. Repeat\
        \ with the identical idempotency key. The external id makes this safe: whether or\
        \ not the first attempt landed, the second one writes the same record.\n- connector.escalate_to_human:\
        \ The write failed three times in a row and will not succeed by retrying. Stop calling\
        \ this tool. Tell the user it must be done by hand and how."
      tags:
      - write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Which record the external id names, and what it should hold.
              properties:
                object_name:
                  description: 'Required. The object, spelled as Salesforce spells it: Contact,
                    Opportunity, Account, or a custom object ending __c.'
                  examples:
                  - Contact
                  - Opportunity
                  maxLength: 80
                  minLength: 1
                  title: Object Name
                  type: string
                external_id_field:
                  description: Required. The field that carries the outside system's identifier.
                    It must be marked External Id on the object; an ordinary text field is
                    refused. Custom fields end __c, as in External_Id__c. Call salesforce_describe_object
                    if you do not know which field this org uses.
                  examples:
                  - External_Id__c
                  maxLength: 80
                  minLength: 1
                  title: External Id Field
                  type: string
                external_id_value:
                  description: 'Required. The identifier itself, as the other system knows
                    it. This decides everything: a value already on a record updates that
                    record, and a value not on any record creates a new one. Never invent
                    one, because inventing a value that happens to exist overwrites somebody
                    else''s record.'
                  examples:
                  - CRM-4471
                  maxLength: 255
                  minLength: 1
                  title: External Id Value
                  type: string
                fields:
                  additionalProperties: true
                  description: 'Required. The fields to set, keyed by Salesforce''s own API
                    names: LastName, Email, StageName, CloseDate. On a create these must include
                    everything the object requires, or the write fails. On an update only
                    what is named here changes.


                    Call salesforce_describe_object first to see which fields are required
                    and which values a picklist accepts.'
                  examples:
                  - Email: ada@example.com
                    LastName: Lovelace
                  minProperties: 1
                  title: Fields
                  type: object
                idempotency_key:
                  description: Required. A unique string for this specific write. The external
                    id already prevents duplicate records; this prevents a retry being counted
                    as a second change.
                  maxLength: 128
                  minLength: 8
                  title: Idempotency Key
                  type: string
                approved:
                  default: false
                  description: Optional, defaults to false, but the call is refused without
                    it. Confirmation that the user asked for this. This can overwrite an existing
                    record and there is no undo.
                  title: Approved
                  type: boolean
              required:
              - object_name
              - external_id_field
              - external_id_value
              - fields
              - idempotency_key
              title: UpsertRecordInput
              type: object
            examples:
              Sync a contact from another system:
                summary: Sync a contact from another system
                value:
                  object_name: Contact
                  external_id_field: External_Id__c
                  external_id_value: CRM-4471
                  fields:
                    LastName: Lovelace
                    Email: ada@example.com
                  idempotency_key: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                  approved: true
      responses:
        '200':
          description: The action ran. Read `ok` to learn whether it succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
                    description: Correlates this call in the logs.
                  data:
                    additionalProperties: false
                    description: The record the external id now names.
                    properties:
                      id:
                        description: Salesforce record id of the record written.
                        title: Id
                        type: string
                      object_name:
                        description: The object it belongs to.
                        title: Object Name
                        type: string
                      external_id_value:
                        description: The identifier that decided which record.
                        title: External Id Value
                        type: string
                      created:
                        description: True when no record carried that external id and one
                          was created. False when a record already carried it and was updated
                          instead. Salesforce decides this, not the caller.
                        title: Created
                        type: boolean
                    required:
                    - id
                    - object_name
                    - external_id_value
                    - created
                    title: UpsertRecordOutput
                    type: object
                  error:
                    oneOf:
                    - *id001
                    - type: 'null'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  rate_limit:
                    $ref: '#/components/schemas/RateLimit'
                  warnings:
                    type: array
                    items:
                      type: string
                required:
                - ok
                - request_id
              examples:
                Sync a contact from another system:
                  summary: Sync a contact from another system
                  value:
                    ok: true
                    request_id: req-01HZY6
                    data:
                      id: 003xx000004TmiQAAS
                      object_name: Contact
                      external_id_value: CRM-4471
                      created: true
components:
  schemas:
    Pagination:
      type: object
      description: Where a paged read stopped. Send `next_cursor` back verbatim for the next
        page; its absence means there are none.
      properties:
        returned:
          type: integer
        next_cursor:
          type:
          - string
          - 'null'
        total_size:
          type:
          - integer
          - 'null'
      required:
      - returned
    RateLimit:
      type: object
      description: The org's API quota, as of the response that carried it.
      properties:
        used:
          type: integer
        limit:
          type: integer
      required:
      - used
      - limit
    ActionError: *id001
