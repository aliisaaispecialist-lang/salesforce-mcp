# Grows with the code: an entry is added only when a file in this repo needs it.
# Nothing here is speculative.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salesforce-connector"
# One source of truth. The server reports `__version__` to every client, so a
# second copy here would eventually disagree with what the protocol says.
dynamic = ["version"]
description = "Salesforce connector with a reusable core, five typed actions, and a thin MCP adapter."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",  # contract.py: typed models and validation
    "pyyaml>=6.0",  # errors/mapping.py: the error classification rules
    "pyjwt>=2.8",  # auth/jwt_bearer.py: builds the signed assertion
    "cryptography>=42.0",  # the RS256 backend pyjwt signs with
    "pydantic-settings>=2.12",  # config.py: environment reading and reporting
    "tenacity>=9.1",  # errors/retry.py: the attempt loop, backoff, and sleeping
    "structlog>=26.1",  # observability.py: structured logs and contextvars
    "httpx>=0.27",  # client.py: the only module that opens a socket
    "pydantic[email]>=2.7",  # schemas: reject a malformed address before sending it
    "aiolimiter>=1.2",  # ratelimit.py: the leaky bucket, done properly
    "itsdangerous>=2.2",  # approval.py: signs state that passes through the client
    "mcp>=2.0.0,<3.0.0",  # mcp_server.py: the protocol itself
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",  # the retry loop is async
    "types-PyYAML>=6.0",  # yaml ships no inline types; mypy --strict needs these
    "respx>=0.21",  # client tests intercept httpx instead of using the network
]

[tool.hatch.version]
# Read from the package, so `pip show` and the MCP handshake cannot disagree.
path = "src/salesforce_connector/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/salesforce_connector"]

[tool.ruff]
# Quoted sources, not our code. ruff formats Python inside markdown fences, and
# `docs/research/` is full of excerpts copied verbatim from other people's
# documentation and books. Reformatting a quotation makes it stop being one --
# and CI failed on exactly that, which is how this exclusion got written.
extend-exclude = ["docs"]
line-length = 100  # PEP 8 permits raising 79 by team agreement
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "ANN", "S", "B", "A", "C4", "DTZ",
    "T20", "PT", "RET", "SIM", "ARG", "PTH", "ERA", "PL", "TRY", "G", "FBT",
    "C90", "RUF",
]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "ANN401",  # Any is occasionally correct at provider boundaries
    "TRY003",  # conflicts with our rule that every error states what failed
    "D107",    # google style documents __init__ args in the class docstring
]

[tool.ruff.lint.per-file-ignores]
# These two actions report on the registry, and the registry builds them, so
# the import can only happen at call time. Deliberate, and explained where it
# is written.
"src/salesforce_connector/actions/list_tools.py" = ["PLC0415"]
"src/salesforce_connector/actions/tool_schema.py" = ["PLC0415"]
# Tests assert, compare literals, and say what they mean in their names rather
# than in docstrings. They stay fully type-annotated.
"tests/**/*.py" = [
    "S101",     # tests assert
    "S105",     # fake tokens are the subject of the redaction tests
    "S106",
    "S311",     # seeded randomness, for deterministic jitter tests
    "D100", "D101", "D102", "D103",  # a test's name is its description
    "ARG002",   # a fixture requested for its side effect is not "unused"
    "PLR2004",  # expected values are literals on purpose
]
# A script run by hand reports what it did. Printing is the interface.
# E402: a standalone script must put `src` on the path before it can import
# the package it is about to use, so its imports cannot come first.
"scripts/**/*.py" = ["T201", "E402"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 3
max-statements = 30
max-returns = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"  # src-layout: the package is not installed while checking
plugins = ["pydantic.mypy"]  # without it, model fields are invisible to strict mode
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_unreachable = true
enable_error_code = [
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "ignore-without-code",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["src"]  # the package is imported from source, not installed
markers = [
    "security: an attack this connector should be immune to",
    "learning: pins real Salesforce behaviour (needs an org)",
    "integration: end to end against a live sandbox (needs an org)",
]
addopts = "-m 'not learning and not integration'"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

