# Grows with the code: an entry is added only when a file in this repo needs it.
# Nothing here is speculative.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salesforce-connector"
version = "0.1.0"  # -> 1.0.0 at final handoff (DoD 12)
description = "Salesforce connector with a reusable core, five typed actions, and a thin MCP adapter."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",  # contract.py: typed models and validation
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/salesforce_connector"]

[tool.ruff]
line-length = 100  # PEP 8 permits raising 79 by team agreement
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "ANN", "S", "B", "A", "C4", "DTZ",
    "T20", "PT", "RET", "SIM", "ARG", "PTH", "ERA", "PL", "TRY", "G", "FBT",
    "C90", "RUF",
]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "ANN401",  # Any is occasionally correct at provider boundaries
    "TRY003",  # conflicts with our rule that every error states what failed
    "D107",    # google style documents __init__ args in the class docstring
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 3
max-statements = 30
max-returns = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"  # src-layout: the package is not installed while checking
plugins = ["pydantic.mypy"]  # without it, model fields are invisible to strict mode
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_unreachable = true
enable_error_code = [
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "ignore-without-code",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
